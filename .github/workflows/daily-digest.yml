name: Build & Publish Daily Kobo Digests

on:
  schedule:
    # Runs daily at 13:00 UTC (5:00 AM PST / 6:00 AM PDT)
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      max_articles:
        description: "Max articles per Hacker News digest"
        required: false
        default: "15"
      retention_days:
        description: "Number of days to keep digests"
        required: false
        default: "4"

permissions:
  contents: write

concurrency:
  group: daily-digest-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Fetch existing gh-pages digests (if branch exists)
        run: |
          mkdir -p dist/digests
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git archive origin/gh-pages | tar -x -C dist || true
          fi
          mkdir -p dist/digests

      - name: Build today's digests (HN + TLDR Tech) and purge expired digests
        env:
          MAX_ARTICLES: ${{ github.event.inputs.max_articles || '15' }}
          RETENTION_DAYS: ${{ github.event.inputs.retention_days || '4' }}
        run: |
          kobo-digest build \
            --source hn \
            --source tldr \
            --out dist/digests \
            --max-articles "$MAX_ARTICLES" \
            --retention-days "$RETENTION_DAYS"

      - name: Publish dist/ to gh-pages branch
        run: |
          touch dist/.nojekyll
          cd dist
          git init
          git checkout -B gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update daily Kobo digests ($(date -u +%Y-%m-%d))"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
